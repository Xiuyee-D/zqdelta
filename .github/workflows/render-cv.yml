# Optional standby template; it does not change or push the source tree.
name: Render a CV
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendercv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: rendercv render _data/cv.yml --settings assets/rendercv/settings.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: cv-template-output
          path: assets/rendercv/rendercv_output/
