name: Upgrade contract checks
on:
  workflow_dispatch:
  pull_request:
    paths: [Gemfile, Gemfile.lock, .al-folio-overrides.yml, test/integration_upgrade_cli.sh]
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    env:
      DEBIAN_MIRROR: http://deb.debian.org
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: ./bin/dev setup
      - run: ./bin/dev bundle exec al-folio upgrade overrides audit --fail-on-stale
      - run: ./bin/dev bundle exec bash test/integration_upgrade_cli.sh
