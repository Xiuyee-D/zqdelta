# Personal site: see docs/MAINTENANCE.md.
---
title: blank
first_name: Ziqian
middle_name:
last_name: Deng
lang: en
icon: brand/monogram.svg
icon_ico: brand/favicon.ico
icon_png: brand/favicon-48.png
apple_touch_icon: /assets/img/brand/apple-touch-icon.png
url: https://Xiuyee-D.github.io
baseurl: "/zqdelta"
last_updated: false
back_to_top: true
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false
feed:
  disable_in_development: true
navbar_fixed: true
footer_fixed: true
search_enabled: false
bib_search: false
max_width: 930px
serve_og_meta: true
serve_schema_org: false
og_image: /assets/img/dzq.png
collections:
  projects:
    output: true
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
include:
  - .nojekyll
  - _pages
  - about.md
  - projects.md
  - blog.md
  - awards.md
  - about-zh.md
  - projects-zh.md
  - blog-zh.md
  - awards-zh.md
  - 404.md
exclude:
  - _pages/*
  - ".al-folio-overrides.yml"
  - ".agents/"
  - ".claude/"
  - ".codex/"
  - ".dev-tools/"
  - ".local/"
  - _site/
  - AGENTS.md
  - al-folio-upgrade-report.md
  - bin/
  - CLAUDE.md
  - Dockerfile.dev
  - Dockerfile.browser
  - docs/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - node_modules/
  - README.md
  - test/
  - vendor
keep_files:
  - CNAME
  - ".nojekyll"
theme: al_folio_core
defaults:
  - scope:
      path: ""
      type: projects
    values:
      published: false
      layout: project
      overview_in_facts: true
      importance: 0
  - scope:
      path: ""
      type: posts
    values:
      published: false
      layout: post
  - scope:
      path: assets
    values:
      sitemap: false
sass:
  style: compressed
jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude:
    - robots.txt
terser:
  compress:
    drop_console: true
scholar:
  last_name:
    - Deng
  first_name:
    - Ziqian
    - Z.
  style: apa
  locale: en
  source: "/_bibliography/"
  bibliography: publications.bib
  bibliography_template: publication
  bibtex_filters:
    - latex
    - smallcaps
    - superscript
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending
filtered_bibtex_keywords:
  - abbr
  - abstract
  - additional_info
  - altmetric
  - annotation
  - arxiv
  - award
  - award_name
  - bibtex_show
  - blog
  - code
  - dimensions
  - eprint
  - google_scholar_id
  - hal
  - html
  - inspirehep_id
  - pdf
  - pmid
  - poster
  - preview
  - selected
  - slides
  - supp
  - video
  - website
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:
imagemagick:
  enabled: true
  widths:
    - 480
    - 800
  input_directories:
    - assets/img/projects/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats:
    webp: "-auto-orient -quality 85"
lazy_loading_images: true
enable_math: true
enable_darkmode: true
enable_progressbar: true
description: Ziqian Deng — research and engineering projects, publications, and technical
  notes.
keywords: Ziqian Deng, academic website, research, engineering
enable_masonry: false
enable_medium_zoom: false
third_party_libraries:
  mathjax:
    integrity:
      js: sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI=
    local:
      fonts: output/chtml/fonts/woff-v2/
    url:
      fonts: https://cdn.jsdelivr.net/npm/mathjax@{{version}}/es5/output/chtml/fonts/woff-v2/
      js: https://cdn.jsdelivr.net/npm/mathjax@{{version}}/es5/tex-mml-chtml.js
    version: 3.2.2
  vanilla-back-to-top:
    integrity:
      js: sha256-uMJJ3EoTyfRBoTbR+lrfu1uRQ87RZG8AR3cVNuQVeFg=
    url:
      js: /assets/js/third-party/vanilla-back-to-top-7.2.1.min.js
    version: 7.2.1
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-cache-bust
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-terser
  - jekyll-toc
  - al_folio_core
  - al_folio_upgrade
  - al_math
  - al_rtl
toc:
  min_level: 2
  max_level: 3
  list_id: blog-toc-list
  list_class: blog-toc-list
