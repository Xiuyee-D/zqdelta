# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # These real images and viewer geometry are intentionally larger than 500 KiB.
        exclude: >-
          ^(?:assets/img/dzq\.png|assets/img/blog/ble/advertising-channels\.png|assets/img/projects/olfactory-flavor-perception/system-architecture\.png|assets/voice-terminal/models/geometry\.vtm)$
